<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The code</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#e8edf1;--ink:#14213d;--muted:#5b6778;--line:#14213d;--accent:#e4572e;--ok:#1b7f5c;--field:#f7f9fa;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151f;--ink:#e6ebf2;--muted:#8d99ab;--line:#e6ebf2;--accent:#ff7a50;--ok:#4fd1a1;--field:#18202e}}
:root[data-theme="dark"]{--bg:#10151f;--ink:#e6ebf2;--muted:#8d99ab;--line:#e6ebf2;--accent:#ff7a50;--ok:#4fd1a1;--field:#18202e}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px}
main{width:100%;max-width:640px}
h1{font-size:clamp(2.4rem,9vw,4.2rem);line-height:.95;margin:0 0 12px;font-weight:800;letter-spacing:-.03em}
p.sub{margin:0 0 28px;color:var(--muted);font-size:1.05rem}
form{display:flex;gap:0;border:2px solid var(--line);background:var(--field)}
input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:500 1rem "IBM Plex Mono",ui-monospace,monospace;padding:16px;outline:none}
input:focus-visible{box-shadow:inset 0 0 0 3px var(--accent)}
button{border:0;border-left:2px solid var(--line);background:var(--ink);color:var(--bg);font:800 1rem "Bricolage Grotesque",sans-serif;padding:0 22px;cursor:pointer}
button:hover{background:var(--accent);color:#fff}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#out{margin-top:24px;min-height:3.2em;font-size:1.5rem;font-weight:600;overflow-wrap:anywhere}
#out.ok{color:var(--ok)}
#out.no{color:var(--muted)}
#out.pop{animation:pop .25s ease-out}
@keyframes pop{from{transform:translateY(6px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){#out.pop{animation:none}}
</style>
</head>
<body>
<main>
<form id="f" autocomplete="off">
<input id="q" type="search" placeholder="Type or paste the code…" aria-label="Code" spellcheck="false" autocapitalize="off" autocorrect="off">
<button type="submit">Submit</button>
</form>
<div id="out" role="status" aria-live="polite"></div>
</main>
<script>
function sha256(s){
  var m=new TextEncoder().encode(s),l=m.length,n=((l+9+63)>>6)<<6,b=new Uint8Array(n);
  b.set(m);b[l]=128;var dv=new DataView(b.buffer);dv.setUint32(n-4,(l*8)>>>0);dv.setUint32(n-8,Math.floor(l*8/4294967296));
  var K=[],p=2,c=0;
  function pr(x){for(var i=2;i*i<=x;i++)if(x%i==0)return 0;return 1}
  while(c<64){if(pr(p)){K[c++]=(Math.pow(p,1/3)%1)*4294967296|0}p++}
  var H=[],q=2;c=0;
  while(c<8){if(pr(q)){H[c++]=(Math.sqrt(q)%1)*4294967296|0}q++}
  var w=new Array(64);
  for(var o=0;o<n;o+=64){
    for(var i=0;i<16;i++)w[i]=dv.getUint32(o+i*4);
    for(i=16;i<64;i++){var a=w[i-15],e=w[i-2];
      var s0=((a>>>7)|(a<<25))^((a>>>18)|(a<<14))^(a>>>3);
      var s1=((e>>>17)|(e<<15))^((e>>>19)|(e<<13))^(e>>>10);
      w[i]=(w[i-16]+s0+w[i-7]+s1)|0}
    var A=H[0],B=H[1],C=H[2],D=H[3],E=H[4],F=H[5],G=H[6],Hh=H[7];
    for(i=0;i<64;i++){
      var S1=((E>>>6)|(E<<26))^((E>>>11)|(E<<21))^((E>>>25)|(E<<7));
      var ch=(E&F)^(~E&G);
      var t1=(Hh+S1+ch+K[i]+w[i])|0;
      var S0=((A>>>2)|(A<<30))^((A>>>13)|(A<<19))^((A>>>22)|(A<<10));
      var mj=(A&B)^(A&C)^(B&C);
      var t2=(S0+mj)|0;
      Hh=G;G=F;F=E;E=(D+t1)|0;D=C;C=B;B=A;A=(t1+t2)|0}
    H[0]=(H[0]+A)|0;H[1]=(H[1]+B)|0;H[2]=(H[2]+C)|0;H[3]=(H[3]+D)|0;
    H[4]=(H[4]+E)|0;H[5]=(H[5]+F)|0;H[6]=(H[6]+G)|0;H[7]=(H[7]+Hh)|0}
  return H.map(function(x){return ('00000000'+(x>>>0).toString(16)).slice(-8)}).join('');
}
function stream(v,len){var out=[],i=0;while(out.length<len){var h=sha256('k'+i+v);for(var j=0;j<64&&out.length<len;j+=2)out.push(parseInt(h.substr(j,2),16));i++}return out}
const V="4799c20fc758cd3e4e0dd73a4a2af4c49eb1cf3b499be32e3c9654eb1ef660c0",C="bBJ8RKYK4O1CxhaBCOgZ5L0reNNZaayDNxqQIrURvlvzYsOZy//OJp/LPnZ+";
const out=document.getElementById("out");
function show(t,ok){out.className=(ok?"ok":"no")+" pop";out.textContent=t;void out.offsetWidth}
function check(v){
  if(sha256("v"+v)!==V){show("keep going",false);return}
  var c=Array.from(atob(C),function(x){return x.charCodeAt(0)}),k=stream(v,c.length);
  show(new TextDecoder().decode(new Uint8Array(c.map(function(x,i){return x^k[i]}))),true);
}
document.getElementById("f").addEventListener("submit",function(e){e.preventDefault();check(document.getElementById("q").value)});
</script>
</body>
</html>
